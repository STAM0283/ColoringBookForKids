stages: [quality, test, build]

default:
  image: node:22.13.0-bookworm-slim
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths: [node_modules/]
  before_script: ["npm ci"]

variables:
  DATABASE_URL: "postgresql://ci:ci@postgres:5432/coloringbook"
  NEXT_PUBLIC_SITE_URL: "https://ci.lepetitcrayon.fr"

lint:
  stage: quality
  script: ["npm run lint"]

typecheck:
  stage: quality
  script: ["npm run typecheck"]

test:
  stage: test
  script: ["npm test"]

build:
  stage: build
  script: ["npm run build"]
