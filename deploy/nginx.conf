limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server { listen 80; listen [::]:80; server_name example.com www.example.com; return 301 https://$host$request_uri; }
server {
 listen 443 ssl http2; listen [::]:443 ssl http2; server_name example.com www.example.com;
 ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
 client_max_body_size 60m; server_tokens off;
 limit_req_status 429;
 proxy_connect_timeout 10s; proxy_send_timeout 120s; proxy_read_timeout 120s;
 add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy strict-origin-when-cross-origin always;
 location /media/images/ { alias /var/www/data/media/images/; expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
 location /media/videos/ { alias /var/www/data/media/videos/; mp4; aio threads; directio 8m; sendfile on; tcp_nopush on; add_header Accept-Ranges bytes; expires 7d; try_files $uri =404; }
 location ~ ^/(data|\.env|\.git) { deny all; }
 location = /api/auth/callback/credentials { limit_req zone=login burst=3 nodelay; proxy_pass http://127.0.0.1:3000; include proxy_params; }
 location / { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
}
